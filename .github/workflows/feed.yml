name: SNS to Telegram

on:
  schedule:
    # 한국 시간 05:03 ~ 23:03, 30분마다 (GitHub 시간은 UTC = 한국 -9시간)
    - cron: "3,33 20-23 * * *"
    - cron: "3,33 0-13 * * *"
    - cron: "3 14 * * *"
  push:
    paths: ["test-run.txt", "backfill.txt"]   # 이 파일을 바꾸면 바로 실행
  workflow_dispatch:
    inputs:
      send_latest:
        description: "테스트: 계정마다 최신 글 1개씩 보내기"
        type: boolean
        default: false
      ignore_quiet:
        description: "테스트: 밤 시간에도 실행"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sns-feed
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 실행 시점의 최신 상태(state.json)를 받기

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          SEND_LATEST: ${{ inputs.send_latest || (github.event_name == 'push' && !contains(join(github.event.head_commit.modified, ','), 'backfill.txt') && !contains(join(github.event.head_commit.added, ','), 'backfill.txt')) }}
          IGNORE_QUIET: ${{ github.event_name == 'push' || inputs.ignore_quiet }}
        run: python feed.py

      - name: Save state
        if: always()
        run: |
          git config user.name "sns-feed-bot"
          git config user.email "sns-feed-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "update state"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
